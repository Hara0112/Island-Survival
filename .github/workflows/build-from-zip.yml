name: Build Island Survival APK from ZIP

on:
  push:
    branches: [main]
    paths:
      - 'Island-Survival-APK-Project.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f Island-Survival-APK-Project.zip
          mkdir project
          unzip -q Island-Survival-APK-Project.zip -d project
          test -f project/Island-Survival-APK-Project/package.json
          test -f project/Island-Survival-APK-Project/android/settings.gradle

      - name: Set project directory
        run: echo "PROJECT_DIR=project/Island-Survival-APK-Project" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies and build game
        working-directory: project/Island-Survival-APK-Project
        run: |
          npm install
          npm run build

      - name: Copy web build into Android assets
        working-directory: project/Island-Survival-APK-Project
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project/Island-Survival-APK-Project/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Island-Survival-debug-apk
          path: project/Island-Survival-APK-Project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
